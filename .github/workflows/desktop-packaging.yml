name: Desktop packaging artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:build
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Build macOS arm64 app, DMG, and ZIP
        run: pnpm exec electron-builder --mac dmg zip --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Wanguoji-0.99.68-mac-arm64-${{ github.run_number }}
          path: desktop/release/*-mac-arm64.*
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2025
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm desktop:build
      - name: Build Windows x64 NSIS installer
        run: pnpm exec electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Wanguoji-0.99.68-win-x64-${{ github.run_number }}
          path: desktop/release/*-win-x64.exe
          if-no-files-found: error
